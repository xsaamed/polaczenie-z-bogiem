<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0d">
  <title>Połączenie z Bogiem</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f5f0e8;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(174, 137, 82, .17), transparent 34%),
        radial-gradient(ellipse at 50% 100%, rgba(105, 78, 49, .13), transparent 48%),
        linear-gradient(145deg, #08090c 0%, #111116 52%, #07080a 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .scene {
      width: min(900px, 92vw);
      padding: 48px 24px;
      text-align: center;
      position: relative;
      animation: appear 1.4s ease both;
    }
    .cross {
      width: 1px;
      height: 74px;
      margin: 0 auto 34px;
      background: linear-gradient(transparent, #d7b77e, transparent);
      position: relative;
      filter: drop-shadow(0 0 9px rgba(220, 183, 126, .65));
    }
    .cross::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 1px;
      background: #d7b77e;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px rgba(220, 183, 126, .5);
    }
    h1 {
      margin: 0 auto;
      max-width: 820px;
      font-size: clamp(2.25rem, 6.1vw, 5.2rem);
      line-height: 1.16;
      font-weight: 400;
      letter-spacing: -.035em;
      text-wrap: balance;
      text-shadow: 0 3px 35px rgba(0,0,0,.6);
    }
    h1 span {
      color: #d8bb8b;
      font-style: italic;
      white-space: nowrap;
    }
    .rule {
      width: 58px;
      height: 1px;
      margin: 38px auto 0;
      background: linear-gradient(90deg, transparent, #a88b61, transparent);
    }
    .glow {
      position: fixed;
      width: 40vw;
      height: 40vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      background: rgba(191, 151, 91, .055);
      filter: blur(80px);
      z-index: -1;
      animation: breathe 7s ease-in-out infinite alternate;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { from { opacity: .45; transform: scale(.92); } to { opacity: .9; transform: scale(1.08); } }
    @media (max-width: 520px) {
      .scene { padding: 32px 12px; }
      .cross { margin-bottom: 28px; }
      h1 span { white-space: normal; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="scene">
    <div class="cross" aria-hidden="true"></div>
    <h1>Jedyne połączenie,<br>jakie będziesz mieć,<br>to połączenie <span>z Bogiem.</span></h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
